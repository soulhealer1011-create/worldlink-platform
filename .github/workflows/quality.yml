name: quality
on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "package.json"
      - "supabase/migrations/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "apps/**"
      - "package.json"
      - "supabase/migrations/**"
      - ".github/workflows/**"
concurrency:
  group: worldlink-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install
      - run: npm run typecheck:web
      - run: npm run build:web
  mobile-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install
      - name: Report dependency advisories
        run: |
          npm audit --json > audit.json || true
          node -e "const a=require('./audit.json'); for (const [name,v] of Object.entries(a.vulnerabilities || {})) console.log(JSON.stringify({name,severity:v.severity,range:v.range,vulnerableVersions:v.vulnerableVersions,via:v.via,fixAvailable:v.fixAvailable}))"
      - run: npm run typecheck:mobile
      - run: npm run export:mobile
      - run: npm --workspace @worldlink/mobile run export:ios
