name: quality
on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "package.json"
      - "supabase/migrations/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "apps/**"
      - "package.json"
      - "supabase/migrations/**"
      - ".github/workflows/**"
concurrency:
  group: worldlink-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run typecheck:web
      - run: npm run build:web
  mobile-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run typecheck:mobile
      - run: npm run export:mobile
